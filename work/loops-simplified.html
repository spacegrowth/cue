<div id="cue-loop-mocks">
<div class="viz-carousel" aria-label="Simpler Cue Loops designs">
  <section data-variant="Simple form" aria-label="Simple form"><div class="cue" data-design="form"></div></section>
  <section data-variant="From your chat" aria-label="From your chat" hidden><div class="cue" data-design="chat"></div></section>
  <section data-variant="Task first" aria-label="Task first" hidden><div class="cue" data-design="task"></div></section>
</div>
<style>
#cue-loop-mocks .cue{--shell:light-dark(#424d23,#242b17);--paper:light-dark(#fffef9,#24271f);--ink:light-dark(#252b19,#eceddf);--sub:light-dark(#64704e,#adb59a);--line:light-dark(#dce0ce,#444b37);--soft:light-dark(#f1f3e8,#323829);--accent:light-dark(#424d23,#d1dca6);--on:light-dark(#ffffff,#242b17);--warn:light-dark(#994c25,#efbb80);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--shell);border-radius:16px;min-height:690px;overflow:hidden}
#cue-loop-mocks *{box-sizing:border-box}#cue-loop-mocks .chrome{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;color:#f8f9ee;flex-wrap:wrap}#cue-loop-mocks .brand{font-size:22px;font-weight:600}#cue-loop-mocks .nav{display:flex;gap:20px;font-size:13px}#cue-loop-mocks .nav b{font-weight:500;border-bottom:2px solid #e1e8bb}#cue-loop-mocks .paper{background:var(--paper);margin:4px 22px 22px;border-radius:13px;padding:28px;min-height:590px}#cue-loop-mocks .wrap{max-width:630px;margin:auto}#cue-loop-mocks h2{font-size:25px;line-height:1.25;letter-spacing:-.5px;margin:9px 0 8px;font-weight:600}#cue-loop-mocks h3{font-size:17px;margin:0 0 5px;font-weight:600}#cue-loop-mocks p{margin:0 0 18px}#cue-loop-mocks .sub{color:var(--sub)}#cue-loop-mocks .tiny{font-size:12px}#cue-loop-mocks .eyebrow{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;font-weight:600;color:var(--sub)}#cue-loop-mocks label{display:block;margin:22px 0 7px;font-weight:500}#cue-loop-mocks input,#cue-loop-mocks textarea,#cue-loop-mocks select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:11px 12px;width:100%}#cue-loop-mocks textarea{resize:vertical;min-height:74px}#cue-loop-mocks button{font:inherit;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);padding:9px 14px;cursor:pointer}#cue-loop-mocks button.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}#cue-loop-mocks button.link{border:0;background:transparent;padding:0;color:var(--sub);text-align:left}#cue-loop-mocks .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#cue-loop-mocks .defaults{margin:23px 0 20px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#cue-loop-mocks .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}#cue-loop-mocks .pill{display:inline-block;background:var(--soft);padding:4px 9px;border-radius:20px;font-size:12px;color:var(--sub)}#cue-loop-mocks .story{margin:25px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#cue-loop-mocks .step{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0}#cue-loop-mocks .step span:first-child{color:var(--sub)}#cue-loop-mocks details{border-bottom:1px solid var(--line);padding:13px 0}#cue-loop-mocks summary{cursor:pointer;color:var(--sub)}#cue-loop-mocks details p{margin:12px 0}#cue-loop-mocks .bubble{background:var(--soft);border-radius:10px;padding:16px 18px;margin:22px 0}#cue-loop-mocks .proposal{border-left:3px solid var(--accent);padding:5px 0 5px 18px;margin-top:25px}#cue-loop-mocks .taskrow{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}#cue-loop-mocks .taskrow div{flex:1}#cue-loop-mocks .warning{color:var(--warn)}#cue-loop-mocks .preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:27px;padding-top:16px;border-top:1px solid var(--line)}#cue-loop-mocks .preview button{font-size:12px;padding:5px 9px}#cue-loop-mocks .preview button[aria-pressed=true]{background:var(--soft)}#cue-loop-mocks .settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}#cue-loop-mocks .settings label{margin-top:12px}#cue-loop-mocks .back{margin-bottom:15px!important}#cue-loop-mocks .plaincheck{display:flex;align-items:center;gap:9px;margin:15px 0;font-size:13px}#cue-loop-mocks .plaincheck input{width:auto}
@media(max-width:550px){#cue-loop-mocks .chrome{padding:15px}#cue-loop-mocks .nav{gap:12px}#cue-loop-mocks .paper{margin:0 10px 10px;padding:21px 17px}#cue-loop-mocks .cue{min-height:800px}#cue-loop-mocks .settings{grid-template-columns:1fr}#cue-loop-mocks h2{font-size:23px}}
</style>
<script>
(()=>{
 const root=document.getElementById('cue-loop-mocks');
 const saved=window.openai?.widgetState?.privateContent||{};
 const states=['Setup','Running','Needs you','Finished'];
 const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const all=[];
 root.querySelectorAll('.cue').forEach(el=>{
 let design=el.dataset.design;
 const model={state:saved[design]||'Setup',goal:'Fix the date parsing failures',done:'All parser tests pass, with no changes to existing test expectations.',limits:false,paused:false};all.push({design,model});
 const persist=()=>window.openai?.setWidgetState?.({modelContent:{concept:design,screen:model.state},privateContent:Object.fromEntries(all.map(x=>[x.design,x.model.state]))})?.catch(()=>{});
 function setup(){
 if(design==='chat')return `<div class="eyebrow">Parser · Chat</div><div class="bubble">The date parser still fails on timezone boundaries. Can you finish fixing it and check the result?</div><p>I can run this as a loop and come back with a reviewed result.</p><div class="proposal"><h3>Fix date parsing</h3><p class="sub">Fix timezone boundaries without changing existing test expectations.</p><div class="step"><span>✓</span><div>Done when parser tests pass and review finds no blocking issues.</div></div><div class="step"><span>↳</span><div>Works in <code>parser</code> · waits for your review before committing.</div></div><span class="sub tiny">Up to 5 attempts · 45 minutes · $10</span><div class="actions"><button data-do="adjust">Adjust</button><button class="primary" data-do="start">Start loop</button></div></div>`;
 if(design==='task')return `<div class="row"><h2>Loops</h2><button data-do="new">+ New loop</button></div><p class="sub">Hand off a task. Come back to a checked result.</p><div class="eyebrow" style="margin-top:28px">Ready to hand off</div><div class="taskrow"><span>↻</span><div><h3>Fix date parsing</h3><span class="sub">Parser · tests and review · waits for you</span></div><button class="primary" data-do="start">Start</button></div><div class="taskrow"><span>✓</span><div><h3>Reduce bundle size</h3><span class="sub">Finished yesterday · 284 KB · reviewed</span></div><button data-do="finished">View result</button></div><details style="margin-top:20px"><summary>Schedules and past runs</summary><p class="sub">No scheduled loops. Tasks run when you start them.</p></details>`;
 return `<div class="eyebrow">New loop</div><h2>What can Cue finish for you?</h2><p class="sub">Cue works, checks the result, and fixes what fails.</p><label for="goal-${design}">What should Cue do?</label><textarea id="goal-${design}" data-field="goal">${escape(model.goal)}</textarea><label for="done-${design}">How will we know it’s done?</label><textarea id="done-${design}" data-field="done">${escape(model.done)}</textarea><label for="folder-${design}">Where should it work?</label><select id="folder-${design}"><option>parser · ~/code/parser</option><option>Choose another folder…</option></select><div class="defaults"><div class="row"><span class="sub">5 attempts · 45 min · $10 maximum</span><button class="link" data-do="adjust">Adjust</button></div><div class="sub tiny" style="margin-top:7px">Runs parser tests, then a fresh review. Waits for you before committing.</div></div><div class="actions"><button data-do="cancel">Cancel</button><button class="primary" data-do="start">Start loop</button></div>`;
 }
 function run(){const needs=model.state==='Needs you',done=model.state==='Finished';return `<button class="link back" data-do="home">‹ Loops</button><div class="row"><span class="eyebrow">Parser</span><span class="pill">${needs?'Needs your decision':done?'Ready for review':model.paused?'Paused':'Working · attempt 2 of 5'}</span></div><h2>${needs?'The same test failed twice.':done?'Date parsing is fixed.':model.paused?'Paused. Pick up when you’re ready.':'Fixing the timezone boundary.'}</h2><p class="sub">${needs?'Cue paused rather than repeat the same fix.':done?'All 212 tests pass. Review found no blocking issues.':'The first attempt fixed 3 failures. Cue is working on the last one.'}</p><div class="story">${needs?`<h3>One choice will help it continue</h3><p>Should dates without a timezone use UTC or the computer’s local timezone?</p><button class="primary" data-do="answer">Use UTC and continue</button> <button data-do="takeover">I’ll take over</button>`:done?`<h3>What changed</h3><p>Normalised timezone offsets and added coverage for midnight boundaries. Existing test expectations stayed the same.</p><div class="row"><span class="sub">2 files changed · nothing committed</span><button data-do="diff">Review changes</button></div>`:`<div class="step"><span>✓</span><div>Reproduced the 4 failing parser tests</div></div><div class="step"><span>✓</span><div>Fixed offset conversion · 3 tests now pass</div></div><div class="step"><span>↻</span><div>${model.paused?'Waiting for you to resume':'Fixing dates that cross midnight'}</div></div><div class="step sub"><span>○</span><div>Next: run tests, then independent review</div></div>`}</div>${needs?`<details><summary>See the failure and what Cue tried</summary><p><code>parse_date_without_timezone</code> expects a consistent result across machines. Two fixes still relied on the local timezone.</p></details>`:`<details><summary>${done?'Checks and review':'Activity and earlier attempts'}</summary><p>Attempt 1: 211 of 212 tests passed.<br>Attempt 2: ${done?'212 of 212 passed. Reviewer found no blocking issues.':'working on the remaining timezone case.'}</p></details>`}<details><summary>Instructions and limits</summary><p>${escape(model.goal)}<br>${escape(model.done)}</p><p class="sub">5 attempts · 45 minutes · $10 · review before commit</p></details><div class="row" style="margin-top:22px"><span class="sub tiny">${done?'18 min working · $0.84': '12 of 45 min · $0.62 of $10'}</span><div class="actions" style="margin-top:0">${done?`<button data-do="fixes">Request changes</button><button class="primary" data-do="commit">Commit changes</button>`:needs?`<button class="link" data-do="stop">End loop</button>`:`<button data-do="pause">${model.paused?'Resume':'Pause'}</button><button data-do="stop">Stop</button>`}</div></div>`;}
 function render(){el.innerHTML=`<div class="chrome"><span class="brand">Cue</span><div class="nav"><span>Inbox</span><span>Board</span><span>Desk</span><b>Loops</b></div></div><div class="paper"><div class="wrap">${model.state==='Setup'?setup():run()}${model.limits?`<div class="settings"><label>Attempts<input type="number" value="5" min="1" max="10"></label><label>Budget ($)<input type="number" value="10" min="1"></label></div><label class="plaincheck"><input type="checkbox" checked> Wait for my review before committing</label>`:''}<div class="preview" aria-label="Preview example states"><span class="tiny sub">Preview</span>${states.map(s=>`<button data-screen="${s}" aria-pressed="${model.state===s}">${s}</button>`).join('')}</div><p class="tiny sub" aria-live="polite" data-feedback style="margin:12px 0 0"></p></div></div>`;}
 el.addEventListener('input',e=>{if(e.target.dataset.field)model[e.target.dataset.field]=e.target.value;});
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.do;if(b.dataset.screen){model.state=b.dataset.screen;model.paused=false;}else if(action==='start'||action==='answer'){model.state='Running';model.paused=false;}else if(action==='home'||action==='cancel'){model.state='Setup';}else if(action==='new'){model.state='Setup';design='form';el.dataset.design='form';}else if(action==='finished')model.state='Finished';else if(action==='adjust')model.limits=!model.limits;else if(action==='pause')model.paused=!model.paused;else if(action==='takeover'){model.state='Running';model.paused=true;}else if(action==='stop'){model.state='Setup';}else if(action==='fixes'){model.state='Needs you';}else {const feedback=el.querySelector('[data-feedback]');feedback.textContent=action==='commit'?'Preview: changes committed on fix/date-parsing.':action==='diff'?'date_parser.ts +18 −9 · date_parser.test.ts +24 −0':'';return;}render();persist();});
 render();
 if(globalThis.Tweak){const opts={compact:false};const tweak=new Tweak({container:el,onChange:()=>{el.querySelector('.paper').style.padding=opts.compact?'20px':'28px';}});tweak.addToggle(opts,'compact',{label:'Compact spacing'});}
 });
})();
</script>
</div>
