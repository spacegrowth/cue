<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cue text box scroll check</title>
  <link rel="stylesheet" href="../ui/vendor/xterm/xterm.css" />
  <link rel="stylesheet" href="../ui/style.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    // A long message in the text box keeps its place while the window redraws (a step landing, the clock):
    // the redraw builds a new box, and that new box must show what the old one showed. Headless:
    //   chrome --headless=new --dump-dom file://…/tests/composer_scroll.html 2> log.txt; grep CHECK log.txt
    window.onerror = (m, src, l, c) => console.log(`CHECK no-error fail ${m} @${l}:${c}`);
    (() => {
      const now = (window.NOW = Date.now()), M = (window.MIN = 60000);
      const st = (id, kind, verb, subject, result, m, o = {}) => ({ t: "step", id, kind, verb, subject, mono: true, result, bad: false, done: true, at_ms: now - m * M, ...o });
      const say = (text, m) => ({ t: "say", text, at_ms: now - m * M });
      // The thread: long enough that the chat scrolls, so a page of earlier messages has somewhere to go.
      const thread = [];
      for (let n = 0; n < 12; n++) thread.push({ role: n % 2 ? "agent" : "you", text: `Message ${n + 1} of the thread, with enough words to take a line or two in the chat.`, at_ms: now - (40 - n) * M });
      thread.push({ role: "you", text: "Do the thing.", at_ms: now - 10.5 * M }, { role: "agent", text: "Done.", at_ms: now - 9 * M }, { role: "you", text: "Now the next thing.", at_ms: now - 2.5 * M });
      const sess = (sid, project, state, thread) => ({ session_id: sid, project, harness: "claude", cwd: `/x/${project}`, state, since_ms: now - 2.4 * M, prompt: "Now the next thing.", segments: [{ kind: "working", start_ms: now - 2.4 * M, end_ms: null }], thread });
      const state = { now_ms: now, window_ms: 30 * M, settings: { appearance: { mode: "light" } }, connections: { claude: { ok: true } }, parked: [], live: [],
        sessions: [sess("w1", "one", "working", thread), sess("w2", "two", "working", thread.slice(0, 4))], items: [], history: [] };
      window.FEED = { version: 1, turns: [
        { at_ms: now - 10.4 * M, more: 0, items: [st("a1", "read", "Read", "main.rs", "80 lines", 10.3), st("a2", "edit", "Edited", "main.rs", "+4 −1", 10), say("Done.", 9)] },
        { at_ms: now - 2.4 * M, more: 0, items: [say("Looking at it.", 2.3), st("c1", "read", "Read", "lib.rs", "40 lines", 2.2), st("c2", "run", "Ran", "cargo test", "", 2.1, { done: false })] },
      ] };
      window.__TAURI__ = {
        app: { getVersion: async () => "0" },
        event: { listen: async () => {}, emit: async () => {} },
        core: { convertFileSrc: (p) => p, invoke: async (cmd, args) => {
          if (cmd === "get_state") return structuredClone(state);
          if (cmd === "get_drafts") return {};
          if (cmd === "session_steps") return args.sessionId === "w1" && args.version !== FEED.version ? structuredClone(FEED) : { version: args.sessionId === "w1" ? FEED.version : 0, turns: args.sessionId === "w1" ? undefined : [] };
          if (cmd === "step_detail") return Object.fromEntries(args.ids.map((id) => [id, { full: "cargo test", output: ["ok"] }]));
          if (cmd === "session_log_page") return Array.from({ length: 30 }, (_, n) => ({ at_ms: args.beforeMs - (30 - n) * M, role: n % 2 ? "agent" : "you", text: `Earlier message ${n + 1}`, images: [] }));
          if (cmd === "actions_list") return { actions: [], pending: [] };
          if (cmd === "transcript_page" || cmd === "closed_sessions" || cmd === "machines_list") return [];
          return null;
        } },
      };
    })();
  </script>
  <script src="../ui/vendor/xterm/xterm.js"></script>
  <script src="../ui/vendor/xterm/addon-fit.js"></script>
  <script src="../ui/vendor/xterm/addon-webgl.js"></script>
  <script src="../ui/core.js"></script>
  <script src="../ui/chat.js"></script>
  <script src="../ui/insights.js"></script>
  <script src="../ui/tips.js"></script>
  <script src="../ui/shells.js"></script>
  <script src="../ui/board.js"></script>
  <script src="../ui/sessions.js"></script>
  <script src="../ui/history.js"></script>
  <script src="../ui/insights_tab.js"></script>
  <script src="../ui/sheets.js"></script>
  <script src="../ui/extensions.js"></script>
  <script src="../ui/actions.js"></script>
  <script src="../ui/background.js"></script>
  <script src="../ui/about.js"></script>
  <script src="../ui/app.js"></script>
  <script>
    const check = (name, ok, why = "") => console.log(`CHECK ${name} ${ok ? "pass" : "fail"}${ok || !why ? "" : ` (${why})`}`);
    const say = (text, m) => ({ t: "say", text, at_ms: NOW - m * MIN });
    const step = (id, m) => ({ t: "step", id, kind: "edit", verb: "Edited", subject: "lib.rs", mono: true, result: "+1 −0", bad: false, done: true, at_ms: NOW - m * MIN });
    const tbox = () => document.querySelector(".active-pane textarea[data-text]");
    const type = (el, text, caret = text.length) => { el.focus(); el.value = text; el.setSelectionRange(caret, caret); el.dispatchEvent(new Event("input", { bubbles: true })); };
    const lines = (n) => Array.from({ length: n }, (_, i) => `Line ${i + 1} of a long message, typed into the box one key at a time.`).join("\n");
    const bottom = (el) => el.scrollHeight - el.clientHeight;
    setTimeout(async () => {
      setActive(null, "w1");
      await loadSteps("w1");
      const el0 = tbox();
      check("setup", !!el0, "no text box");
      // Typing at the end of a long message: the end stays in view through a redraw.
      const text = lines(40);
      type(el0, text);
      const end0 = el0.scrollTop;
      check("end-before", end0 > 0 && Math.abs(end0 - bottom(el0)) <= 1, `top=${end0} bottom=${bottom(el0)}`);
      renderMain();
      const el1 = tbox();
      check("end-after-redraw", Math.abs(el1.scrollTop - bottom(el1)) <= 1, `top ${end0} -> ${el1.scrollTop} (bottom ${bottom(el1)})`);
      // Editing in the middle: scrolled to line 20, caret there. A redraw leaves the box where it was.
      const mid = text.indexOf("Line 20 ");
      el1.setSelectionRange(mid, mid);
      el1.scrollTop = Math.round(bottom(el1) / 2);
      const midTop = el1.scrollTop;
      renderMain();
      const el2 = tbox();
      check("middle-after-redraw", Math.abs(el2.scrollTop - midTop) <= 1 && el2.selectionEnd === mid, `top ${midTop} -> ${el2.scrollTop}, caret ${mid} -> ${el2.selectionEnd}`);
      // A key typed there, then a redraw: still there.
      type(el2, text.slice(0, mid) + "x" + text.slice(mid), mid + 1);
      const keyTop = el2.scrollTop;
      renderMain();
      const el3 = tbox();
      check("middle-after-key-and-redraw", Math.abs(el3.scrollTop - keyTop) <= 1 && Math.abs(keyTop - midTop) <= 20, `top ${midTop} -> ${keyTop} -> ${el3.scrollTop}`);
      // The chat above, scrolled up to read: neither typing nor redraws move it.
      const chat = document.querySelector("[data-chat]");
      chat.scrollTop = Math.round((chat.scrollHeight - chat.clientHeight) / 2);
      const chatTop = chat.scrollTop;
      type(tbox(), text + "\nmore", text.length + 5);
      renderMain();
      check("chat-stays", chat.isConnected && Math.abs(document.querySelector("[data-chat]").scrollTop - chatTop) <= 1, `${chatTop} -> ${document.querySelector("[data-chat]").scrollTop}`);
      console.log("CHECK done pass");
    }, 300);
  </script>
</body>
</html>
