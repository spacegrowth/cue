      // Conversations, as the backend keeps them per session (the last agent entry is the finished message).

      const code = "```\n" + Array.from({ length: 30 }, (_, n) => `line ${n + 1}: spend[${n}] = tokens * rate`).join("\n") + "\n```";
      state.sessions[0].thread = [
        { role: "agent", text: longEarlier, at_ms: now - 26 * M },
        { role: "you", text: "go, and keep the footer total", at_ms: now - 25 * M, images: [] },
        { role: "agent", text: "Done with the parser. Sample output:\n\n" + code, at_ms: now - 18 * M },

      state.sessions[3].thread = [

        { role: "agent", text: "Bash: uv run pytest tests/lines -q -x", at_ms: now - 3 * M },

      // ?starred=1: five sessions starred, their list open under the ★ chip.
      if (q.has("starred")) state.sessions.slice(0, 5).forEach((x, n) => (x.starred_ms = now - (50 - n) * M));
      // ?held=1: the working order-engine session has a message kept in Cue, open in Active.
      if (q.has("held")) { const x = state.sessions.find((y) => y.project === "order-engine"); if (x) { x.held = { role: "you", text: "also keep the old broker session open while you test", at_ms: now - M, images: [] }; try { localStorage.setItem("cue.spot", JSON.stringify({ sid: x.session_id, view: "board" })); } catch {} } }

      // ?ufile=1: meters from your usage file beside Claude Code's; ?ufile=err: a file that doesn't match.
      if (q.get("ufile") === "1") state.usage_file = { path: "~/.cue/usage.csv", as_of_ms: now - 4 * M, meters: [{ label: "Team", spent: 42.6, limit: 50, unit: "$", resets_ms: now + 3 * 24 * 3600000 }, { label: "Credits", spent: 1200, limit: null, unit: "credits", resets_ms: null }] };
      if (q.get("ufile") === "err") state.usage_file = { path: "~/.cue/usage.csv", as_of_ms: now - 4 * M, meters: [], error: "Line 2: \"spent\" isn't a number (\"lots\")." };
      const listeners = (window.__listeners = {});
      const emit = () => (listeners.state || []).forEach((f) => f({ payload: structuredClone(state) }));
      window.__TAURI__ = {
        app: { getVersion: async () => "0.1.5" },
        core: { convertFileSrc: (p) => p, invoke: async (cmd, args) => {
          console.log("[cue-preview]", cmd, JSON.stringify(args));
          if (cmd === "get_state") return structuredClone(state);
          if (cmd === "update_check") return { current: "0.1.5" };
          // By the way: a side question, answered after a moment (the real one asks a copy of the conversation).
          if (cmd === "btw") { await new Promise((r) => setTimeout(r, 600)); return "Because the CSV export is read by the **finance script**, which expects the old order. Changing it would break their import, so it only changed the board."; }
          // Drafts: the real app keeps them in ~/.cue/cue.db; the preview keeps them in this browser.

          if (cmd === "set_draft") { const all = JSON.parse(localStorage.getItem("preview.drafts") || "{}"); if (args.text.trim() || args.images.length) all[args.key] = { text: args.text, images: args.images }; else delete all[args.key]; localStorage.setItem("preview.drafts", JSON.stringify(all)); return; }

          // A message kept in Cue while a session works (?held=1): Edit / Esc takes it back.
          if (cmd === "unhold_message") { const x = state.sessions.find((y) => y.session_id === args.sessionId); const h = x?.held || null; if (x) delete x.held; emit(); return h; }
          if (cmd === "session_commands") return [{ name: "compact", kind: "command", desc: "Summarize the conversation to free up context" }, { name: "clear", kind: "command", desc: "Start over: clear the conversation" }, { name: "context", kind: "command", desc: "How full the context is" }, { name: "model", kind: "command", desc: "Set the AI model for Claude Code", hint: "<model>", args: [{ value: "default", label: "Default (recommended)", desc: "Opus 5.5 · Best for everyday, complex tasks" }, { value: "opus", label: "Opus 5.5", desc: "For complex work and everyday tasks" }, { value: "sonnet", label: "Sonnet 5.5", desc: "Most efficient for simpler tasks" }, { value: "haiku", label: "Haiku 4.5", desc: "Fastest for quick answers" }] }, { name: "effort", kind: "command", desc: "Set effort level for model usage", hint: "<low|medium|high|xhigh|max|auto>", args: ["low", "medium", "high", "xhigh", "max", "auto"].map((v) => ({ value: v, label: v, desc: "" })) }, { name: "rename", kind: "command", desc: "Rename the current conversation", hint: "[name]", args: [] }, { name: "commit-push-merge", kind: "skill", desc: "Land in-flight work: commit, push, and merge" }, { name: "relay:spawn", kind: "skill", desc: "Start an executor on a packet" }, { name: "relay:verify", kind: "skill", desc: "Check an executor's report against what it staged" }];
          if (cmd === "focus_session") return "iTerm session";
          if (cmd === "close_session") return "Closed its iTerm tab";
          if (cmd === "agents_installed") return ["claude", "pi"];
          if (cmd === "new_session") return { session_id: "", detail: `Started ${args.agent} in a new iTerm tab` };
          if (cmd === "crew_action") return args.action === "review" ? `Sent /relay:review ${args.sessionId}` : args.action.startsWith("auto-") ? `Auto mode ${args.action.slice(5)}` : "Opened in your browser";
        } },
        event: { listen: async (name, f) => { (listeners[name] ||= []).push(f); } },
      };
    })();
  </script>

  <script>
    setTimeout(() => {
      const q = location.search;
      if (/hist=1/.test(q)) document.dispatchEvent(new KeyboardEvent("keydown", { key: "h" }));
      if (/settings=1/.test(q)) document.dispatchEvent(new KeyboardEvent("keydown", { key: "," }));
      if (/open=1/.test(q)) document.querySelector("[data-toggle]")?.click();
      // ?more=1: open the chat header's ⋯ menu.
      if (/more=1/.test(q)) setTimeout(() => document.querySelector("[data-more]")?.click(), 500);
      // ?live=1&quiet=1: open the quiet session q2 (Sessions view → its tile).
      if (/quiet=1/.test(q)) setTimeout(() => { document.querySelector('[data-view="sessions"]')?.click(); setTimeout(() => document.querySelector('[data-sv="quiet"][data-sid="q2"]')?.click(), 300); }, 300);
      // ?steps=open: open the failed test run and an edit in the Active chat.
      if (/steps=open/.test(q)) setTimeout(() => ["b3", "b5"].forEach((id) => document.querySelector(`[data-step="relay|${id}"]`)?.click()), 2500);
      const rowQ = new URLSearchParams(q).get("row");
      if (rowQ) { document.querySelector(`[data-row="${rowQ}"]`)?.click(); const second = new URLSearchParams(q).get("row2"); if (second) setTimeout(() => document.querySelector(`[data-row="${second}"]`)?.click(), 50); }
      // ?view=sessions: the Sessions view.
      if (/view=sessions/.test(q)) document.querySelector('[data-view="sessions"]')?.click();
      // ?keys=l,ArrowDown,…: press these keys in order, on whatever has focus (to check shortcuts).
      const keysQ = new URLSearchParams(q).get("keys");
      if (keysQ) keysQ.split(",").forEach((k, i) => setTimeout(() => (document.activeElement || document.body).dispatchEvent(new KeyboardEvent("keydown", { key: k.replace(/^Meta\+/, ""), metaKey: k.startsWith("Meta+"), bubbles: true })), 100 + i * 60));
      // ?live=1&drop=1[&new=1]: the header's live drop-down, optionally with the New session form.
      if (/drop=1/.test(q)) { document.querySelector('[data-lv="toggle"]')?.click(); if (/new=1/.test(q)) setTimeout(() => document.querySelector('.lv-pop [data-lv="new"]')?.click(), 50); }
      const sessQ = new URLSearchParams(q).get("sess");
      if (sessQ) document.querySelector(`[data-session="${sessQ}"]`)?.click();
      if (/upop=1/.test(q)) document.querySelector("[data-usage=meter], [data-usage=model], [data-usage=out]")?.dataset.usage === "meter" && document.querySelector("[data-usage=meter]").click();
      // ?upd=1: the card for a newer Cue.
      if (/upd=1/.test(q)) (window.__listeners["update-ready"] || []).forEach((f) => f({ payload: { version: "0.1.4", notes: "" } }));
      // ?detail=<id>: open that entry from Recently answered.
      const detailQ = new URLSearchParams(q).get("detail");
      if (detailQ) document.querySelector(`.tl[data-detail="${detailQ}"]`)?.click();
      const pickId = new URLSearchParams(q).get("pick");
      if (pickId) document.querySelector(`[data-big="${pickId}"]`)?.click();
      const chipQ = new URLSearchParams(q).get("chip");
      if (chipQ) setTimeout(() => { document.querySelector(`[data-chip="${chipQ}"]`)?.click(); if (/twice=1/.test(q)) setTimeout(() => document.querySelector(`[data-chip="${chipQ}"]`)?.click(), 50); }, 60);
      // ?typedans=1: type your own answer to the question on screen (multi-question ask).
      if (/typedans=1/.test(q)) setTimeout(() => {
        document.querySelector('.active-pane [data-act="redirect"]')?.click();
        setTimeout(() => {
          const ta = document.querySelector(".active-pane .act-card textarea");
          ta.value = "what is this ?"; ta.dispatchEvent(new Event("input", { bubbles: true }));
          ta.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        }, 50);
      }, 80);
      if (/choose=1/.test(q)) setTimeout(() => document.querySelector('.active-pane [data-pick="0:1"]')?.click(), 80);
      if (/typelong=1/.test(q)) { const ta = document.querySelector(".active-pane textarea"); ta.focus(); ta.value = "line one\nline two\nline three\nline four\nline five"; ta.dispatchEvent(new Event("input", { bubbles: true })); }
      // ?click=<selector>: click that element once the window is drawn (e.g. a card at the bottom of a column).
      const clickQ = new URLSearchParams(q).get("click");
      if (clickQ) setTimeout(() => document.querySelector(clickQ)?.click(), 700);
      if (/starred=1/.test(q)) setTimeout(() => document.querySelector("[data-star-chip]")?.click(), 600);
      // ?slash=re: type "/re" into the Active chat's box (the "/" menu); ?slash=reomte%20x: an unknown command.
      const slashQ = new URLSearchParams(q).get("slash");
      if (slashQ) setTimeout(() => { const ta = document.querySelector(".active-pane .foot textarea"); ta.focus(); ta.value = `/${slashQ}`; ta.dispatchEvent(new Event("input", { bubbles: true })); if (/down=1/.test(q)) ta.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true })); }, 600);
      if (/type=1/.test(q)) { const ta = document.querySelector(".active-pane textarea"); ta.value = "half-written reply, kept across restarts"; ta.dispatchEvent(new Event("input", { bubbles: true })); }
      if (/send=1/.test(q)) setTimeout(() => { const ta = document.querySelector(".active-pane textarea"); ta.value = "carry it over to the successor"; ta.dispatchEvent(new Event("input", { bubbles: true })); document.querySelector(".active-pane .btn.send").click(); }, 100);
      if (/allow=1/.test(q)) setTimeout(() => document.querySelector(".active-pane [data-act=allow]")?.click(), 100);
    }, 300);
  </script>
