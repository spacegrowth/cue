<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cue preview</title>
</head>
<body>
  <div id="app"></div>
  <!-- Design preview: the real UI on the fake bridge (tests/ui/bridge.js) with the sample world of
       tests/ui/scenarios/preview.js. Serve the repo root (python3 -m http.server) and open /tests/preview.html
         ?hist=1 History view · ?settings=1 sheet · ?theme=dark|light · ?still=1 no animations · and the flags
       documented in preview.js and below. -->
  <script>window.onerror = (m, src, l, c) => { document.body.insertAdjacentHTML("beforeend", `<pre style="position:fixed;top:0;left:0;z-index:99;color:red;background:#fff">${m} @${l}:${c}</pre>`); };</script>
  <script src="ui/bridge.js"></script>
  <script src="ui/load.js"></script>
  <script src="ui/scenarios/preview.js"></script>
  <script>
    (() => {
      const world = previewWorld(new URLSearchParams(location.search), Date.now());
      for (const [k, v] of Object.entries(world.prefs)) try { localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); } catch {}
      CueUI.load(() => CueBridge.start(() => world.state));
    })();
    // Once the UI is up, the flags that open something in it. (`state` here is the window's own, ui/core.js.)
    CueUI.ready.then(() => {
      setTimeout(() => {
        const q = location.search;
        if (/hist=1/.test(q)) document.dispatchEvent(new KeyboardEvent("keydown", { key: "h" }));
        if (/settings=1/.test(q)) document.dispatchEvent(new KeyboardEvent("keydown", { key: "," }));
        if (/open=1/.test(q)) document.querySelector("[data-toggle]")?.click();
        // ?tasks=…: the open session's Tasks tab.
        if (/tasks=/.test(q) && !/chat=1/.test(q)) setTimeout(() => document.querySelector("[data-tasks-tab]")?.click(), 600);
        // ?more=1: open the chat header's ⋯ menu.
        if (/more=1/.test(q)) setTimeout(() => document.querySelector("[data-more]")?.click(), 500);
        // ?live=1&quiet=1: open the quiet session q2 (Sessions view → its tile).
        if (/quiet=1/.test(q)) setTimeout(() => { document.querySelector('[data-view="sessions"]')?.click(); setTimeout(() => document.querySelector('[data-sv="quiet"][data-sid="q2"]')?.click(), 300); }, 300);
        // ?steps=open: open the failed test run and an edit in the Active chat.
        if (/steps=open/.test(q)) setTimeout(() => ["b3", "b5"].forEach((id) => document.querySelector(`[data-step="relay|${id}"]`)?.click()), 2500);
        const rowQ = new URLSearchParams(q).get("row");
        if (rowQ) { document.querySelector(`[data-row="${rowQ}"]`)?.click(); const second = new URLSearchParams(q).get("row2"); if (second) setTimeout(() => document.querySelector(`[data-row="${second}"]`)?.click(), 50); }
        // ?view=sessions: the Sessions view.
        if (/view=sessions/.test(q)) document.querySelector('[data-view="sessions"]')?.click();
        // ?tab=insights: the Insights view (&itab=empty: no turns read yet).
        if (/tab=insights/.test(q)) document.querySelector('[data-view="insights"]')?.click();
        // ?keys=l,ArrowDown,…: press these keys in order, on whatever has focus (to check shortcuts).
        const keysQ = new URLSearchParams(q).get("keys");
        if (keysQ) keysQ.split(",").forEach((k, i) => setTimeout(() => (document.activeElement || document.body).dispatchEvent(new KeyboardEvent("keydown", { key: k.replace(/^Meta\+/, ""), metaKey: k.startsWith("Meta+"), bubbles: true })), 100 + i * 60));
        // ?live=1&drop=1[&new=1]: the header's live drop-down, optionally with the New session form.
        if (/drop=1/.test(q)) { document.querySelector('[data-lv="toggle"]')?.click(); if (/new=1/.test(q)) setTimeout(() => document.querySelector('.lv-pop [data-lv="new"]')?.click(), 50); }
        const sessQ = new URLSearchParams(q).get("sess");
        if (sessQ) document.querySelector(`[data-session="${sessQ}"]`)?.click();
        if (/upop=1/.test(q)) document.querySelector("[data-usage=meter], [data-usage=model], [data-usage=out]")?.dataset.usage === "meter" && document.querySelector("[data-usage=meter]").click();
        // ?upd=1: the card for a newer Cue.
        if (/upd=1/.test(q)) CueBridge.emit("update-ready", { version: "0.1.4", notes: "" });
        // ?detail=<id>: open that entry from Recently answered.
        const detailQ = new URLSearchParams(q).get("detail");
        if (detailQ) document.querySelector(`.tl[data-detail="${detailQ}"]`)?.click();
        const pickId = new URLSearchParams(q).get("pick");
        if (pickId) document.querySelector(`[data-big="${pickId}"]`)?.click();
        const chipQ = new URLSearchParams(q).get("chip");
        if (chipQ) setTimeout(() => { document.querySelector(`[data-chip="${chipQ}"]`)?.click(); if (/twice=1/.test(q)) setTimeout(() => document.querySelector(`[data-chip="${chipQ}"]`)?.click(), 50); }, 60);
        // ?typedans=1: type your own answer to the question on screen (multi-question ask).
        if (/typedans=1/.test(q)) setTimeout(() => {
          document.querySelector('.active-pane [data-act="redirect"]')?.click();
          setTimeout(() => {
            const ta = document.querySelector(".active-pane .act-card textarea");
            ta.value = "what is this ?"; ta.dispatchEvent(new Event("input", { bubbles: true }));
            ta.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
          }, 50);
        }, 80);
        if (/choose=1/.test(q)) setTimeout(() => document.querySelector('.active-pane [data-pick="0:1"]')?.click(), 80);
        if (/typelong=1/.test(q)) { const ta = document.querySelector(".active-pane textarea"); ta.focus(); ta.value = "line one\nline two\nline three\nline four\nline five"; ta.dispatchEvent(new Event("input", { bubbles: true })); }
        // ?click=<selector>: click that element once the window is drawn (e.g. a card at the bottom of a column).
        const clickQ = new URLSearchParams(q).get("click");
        if (clickQ) setTimeout(() => document.querySelector(clickQ)?.click(), 700);
        if (/starred=1/.test(q)) setTimeout(() => document.querySelector("[data-star-chip]")?.click(), 600);
        // ?slash=re: type "/re" into the Active chat's box (the "/" menu); ?slash=reomte%20x: an unknown command.
        const slashQ = new URLSearchParams(q).get("slash");
        if (slashQ) setTimeout(() => { const ta = document.querySelector(".active-pane .foot textarea"); ta.focus(); ta.value = `/${slashQ}`; ta.dispatchEvent(new Event("input", { bubbles: true })); if (/down=1/.test(q)) ta.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true })); }, 600);
        if (/type=1/.test(q)) { const ta = document.querySelector(".active-pane textarea"); ta.value = "half-written reply, kept across restarts"; ta.dispatchEvent(new Event("input", { bubbles: true })); }
        if (/send=1/.test(q)) setTimeout(() => { const ta = document.querySelector(".active-pane textarea"); ta.value = "carry it over to the successor"; ta.dispatchEvent(new Event("input", { bubbles: true })); document.querySelector(".active-pane .btn.send").click(); }, 100);
        if (/allow=1/.test(q)) setTimeout(() => document.querySelector(".active-pane [data-act=allow]")?.click(), 100);
        // ?term=1: agent-relay is in tmux (&open=term: its terminal open; &wait=1: waiting in it).
        if (/term=1/.test(q)) {
          const r = state.sessions.find((x) => x.session_id === "relay");
          if (r) r.tmux_pane = "%1";
          if (/wait=1/.test(q)) state.items.unshift({ id: "tw", kind: "terminal", harness: "claude", session_id: "relay", cwd: r.cwd, project: "agent-relay", message: "Waiting in its terminal: approve Bash", context: [], created_ms: Date.now() - 60000, status: "pending", outcome: "" });
          termLast.set("relay", /wait=1/.test(q) ? "❯ 1. Yes   2. Yes, and don't ask again   3. No (esc)" : "✻ Baking… (12s) · Bash(make release)");
          setActive(null, "relay");
          if (/open=term/.test(q)) setTimeout(() => openTerm("relay"), 200);
          if (/stalled=1/.test(q)) setTimeout(() => ["l", "s"].forEach((k) => termObj?.input(k)), 700);
        }
        // &inspick=1 (with ?ins=1&open=relay): its hand-off insight's skill drop-up open.
        if (/inspick=1/.test(q)) setTimeout(() => insAct("ins-choose", { sid: "relay" }), 600);
        // ?open=<session id>: that session's chat in Active (e.g. names: at its prompt while background agents work).
        const openQ = new URLSearchParams(q).get("open");
        if (openQ && openQ !== "term") setTimeout(() => setActive(null, openQ), 80);
        // &restart=done|failed: the line a finished (or failed) restart leaves in that session's chat.
        const rsDone = new URLSearchParams(q).get("restart");
        if (openQ && /^(done|failed)$/.test(rsDone || "")) setTimeout(() => { state.restarted = { [openQ]: [{ at_ms: Date.now() - 60000, secs: 6, servers: ["linear", "chrome-devtools", "sentry"], error: rsDone === "failed" ? "it's mid-turn; try when it's idle" : null }] }; CueBridge.emit("state", structuredClone(state)); }, 200);
        // &restart=stop|start|load: that session restarting (after an MCP change; &restartkind=plain: ⋯ → Restart session), on that step.
        const rsQ = new URLSearchParams(q).get("restart");
        if (openQ && rsQ && !/^(done|failed)$/.test(rsQ)) setTimeout(() => { state.restarting = { [openQ]: { step: rsQ, since_ms: Date.now(), servers: 3, mcp: !/restartkind=plain/.test(location.search) } }; CueBridge.emit("state", structuredClone(state)); }, 200);
        // &mcp=menu: its ⋯ menu open (the MCP servers item); &mcp=1: ⋯ → MCP servers…, the picker open;
        // &mcp=tools: that, with linear's tools unfolded.
        const mcpQ = new URLSearchParams(q).get("mcp");
        if (openQ && mcpQ) setTimeout(() => { document.querySelector(".active-pane [data-more]")?.click(); if (mcpQ !== "menu") setTimeout(() => { document.querySelector("[data-mcp-ask]")?.click(); if (mcpQ === "tools") setTimeout(() => document.querySelector(".mcp-tfold")?.click(), 300); }, 300); }, 500);
        // &bg=<agent id>: that background agent of the open session in full (chat/helpers.js helperPane), e.g. open=names&bg=h1 (running) or h2 (finished).
        // &tmux=<session id>: that session runs in tmux (its terminal dock shows, closed), e.g. with open=names&bg=h3.
        const tmuxQ = new URLSearchParams(q).get("tmux");
        if (tmuxQ) { const x = state.sessions.find((y) => y.session_id === tmuxQ); if (x) x.tmux_pane = "%9"; }
        // &fold=1: the open session's tray of background work starts folded to its head row.
        if (openQ && /fold=1/.test(q)) trayFolded.add(openQ);
        const bgQ = new URLSearchParams(q).get("bg");
        if (openQ && bgQ) setTimeout(() => { helperView = { sid: openQ, id: bgQ }; renderMain(); }, 400);
        // ?new=1: + New session (⌘N), with tmux installed; &agent=pi|codex picks the agent, &perm=skip a permission.
        if (/new=1/.test(q)) setTimeout(() => {
          state.settings.sessions = { tmux: false, tmux_installed: true, terminal: "iTerm" };
          agentsAvail = ["claude", "codex", "pi"];
          const p = new URLSearchParams(q);
          if (p.get("agent")) newAgent = p.get("agent");
          if (p.get("perm")) newPerm = p.get("perm");
          liveSpot = true;
          lvAct("new", {});
        }, 100);
        // ?reader=1: the open chat's first long reply opens in the reader (chat/reader.js readerPane).
        if (/reader=1/.test(q)) setTimeout(() => document.querySelector("[data-read]")?.click(), 600);
        // ?bg=1: the "2 bg" on the names card is clicked, opening that session onto its newest running agent.
        if (/bg=1/.test(q)) setTimeout(() => document.querySelector('[data-bg-open="names"]')?.click(), 600);
        // Actions (ui/actions.js), on agent-relay: ?actions=1 its Actions tab; ?palette=1 ⌘E; ?trust=1 the tab, then its
        // agent changes the file (the trust sheet opens on its own); ?editAction=1 ✎ on Install; ?actlog=1 Test's output;
        // ?suggest=1 a finished turn that changed package.json, a migration and src (suggestions under the reply: one to
        // run, one failed, one running); ?running=1 agent-relay pinned with two servers, its dots' popover open;
        // ?ask=1 order-engine (working): ⌘E, ↵ on Install, which asks Run now / After this turn.
        if (/suggest=1/.test(q)) { const r = state.sessions.find((x) => x.session_id === "relay"); r.changes = { files: [{ path: "package.json", add: 2, del: 1 }, { path: "migrations/0042_add_spend.sql", add: 14, del: 0 }, { path: "src/board.ts", add: 48, del: 3 }], add: 64, del: 4 }; }
        if (/running=1/.test(q)) state.settings.project = { ...(state.settings.project || {}), pins: ["agent-relay"] };
        if (/[?&](actions|palette|trust|editAction|actlog|suggest)=1/.test(q)) setTimeout(() => {
          setActive(null, "relay");
          if (/palette=1/.test(q)) return setTimeout(() => document.dispatchEvent(new KeyboardEvent("keydown", { key: "e", metaKey: true, bubbles: true })), 200);
          if (/suggest=1/.test(q)) return;
          setTimeout(() => {
            document.querySelector('[data-ac="tab"]')?.click();
            if (/trust=1/.test(q)) setTimeout(() => CueBridge.world.agentChangesActions(), 700);
            if (/editAction=1/.test(q)) setTimeout(() => document.querySelector('[data-ac="edit"][data-id="shared:Install"]')?.click(), 400);
            if (/actlog=1/.test(q)) setTimeout(() => document.querySelector('.ac-row [data-ac="log"][data-id="shared:Test"]')?.click(), 400);
          }, 200);
        }, 120);
        // ?newproj=1 + New in a plain folder: its Project line, its list open (Put in a project…).
        if (/newproj=1/.test(q)) setTimeout(() => {
          document.dispatchEvent(new KeyboardEvent("keydown", { key: "n", metaKey: true, bubbles: true }));
          setTimeout(() => { draft("new-cwd").text = "~/scratch/notes"; renderMain(); setTimeout(() => { document.querySelector('[data-lv="proj-open"]')?.click(); }, 200); }, 200);
        }, 120);
        if (/running=1/.test(q)) setTimeout(() => { setActive(null, "relay"); setTimeout(() => document.querySelector('.ac-dots[data-where="pin"]')?.click(), 500); }, 120);
        if (/ask=1/.test(q)) setTimeout(() => {
          setActive(null, "eng");
          setTimeout(() => { document.dispatchEvent(new KeyboardEvent("keydown", { key: "e", metaKey: true, bubbles: true })); setTimeout(() => document.querySelector('[data-text="ac-find"]')?.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true })), 500); }, 200);
        }, 120);
        // With ?ins=1: &inss=open opens agent-relay's fresh-session plan (its chip by the box), =busy is its button
        // just tapped (insights.js handoffChip).
        const inss = new URLSearchParams(q).get("inss");
        if (inss) setTimeout(() => {
          if (inss === "open") insPlan.add("relay");
          if (inss === "busy") { insPlan.add("relay"); insBusy.set("relay", "Handing off…"); }
          renderMain();
        }, 150);
      }, 300);
    });
  </script>
</body>
</html>
