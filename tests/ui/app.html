<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cue</title>
</head>
<body>
  <div id="app"></div>
  <!-- The real UI on the fake bridge, its state from tests/ui/scenarios/<scenario>.json (a snapshot as hub/mod.rs
       snapshot() builds it). Other ?flags reach the fakes (bridge.js: w.q), e.g. ?latency=0 for no made-up waits. -->
  <script src="bridge.js"></script>
  <script src="load.js"></script>
  <script>
    const scenario = new URLSearchParams(location.search).get("scenario") || "board-waiting";
    CueUI.load(() => CueBridge.start(async () => {
      const r = await fetch(`scenarios/${encodeURIComponent(scenario)}.json`);
      if (!r.ok) throw new Error(`no scenario ${scenario}`);
      return r.json();
    }));
  </script>
</body>
</html>
