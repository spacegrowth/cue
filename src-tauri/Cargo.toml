[package]
name = "cue"
version = "0.1.86"
description = "One window for every coding agent that needs a decision from you"
edition = "2021"

[lib]
name = "cue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# xtask: the source inventory and lints (docs/dev/inventory.md), a dev-only tool run by `cargo run -p xtask`
# and by `cargo test` (locking/lint.rs). Not a default member: `cargo build` and `tauri build` never build it.
[workspace]
members = ["xtask"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: Cue edits your agents' settings files (Connect) and keeps their keys where they were.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread", "signal"] }
libc = "0.2"
base64 = "0.22"
# The built-in terminal: a pseudo-terminal Cue attaches to a session's tmux with.
portable-pty = "0.9"
# Only for the optional add-on (`ext` feature).
axum = { version = "0.8", features = ["ws"], optional = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }
jsonwebtoken = { version = "9", optional = true }
vt100 = { version = "0.16", optional = true }
# Only for the end-to-end tests (`e2e` feature, debug builds only): a WebDriver server inside the app that
# tests/e2e drives the real window with. lib.rs refuses to compile it into a release build.
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[dev-dependencies]
xtask = { path = "xtask" }
# A mock app (tauri::test) for the updater's tests: find_update against a fake release server.
tauri = { version = "2", features = ["protocol-asset", "test"] }

[profile.release]
# File and line for every address, kept out of the app: rustc writes them to cue.dSYM next to the binary
# (dsymutil, at link time) and only then strips the binary's debug info. release.sh keeps the dSYM, so a
# hang report's addresses resolve with atos. The symbol table stays, so the backtraces Cue writes to
# locks.log name their functions.
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSError", "NSGeometry", "NSSet", "NSProcessInfo"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound", "UNNotification", "UNNotificationResponse", "UNNotificationAction", "UNNotificationCategory", "block2"] }
block2 = "0.6"

[features]
# The add-on in src-tauri/ext/ (not part of this repo); install.sh turns it on when that folder is there.
ext = ["dep:axum", "dep:qrcode", "dep:jsonwebtoken", "dep:vt100"]
# The end-to-end tests' driver (tests/e2e/run.sh builds with it). Off by default; a release build with it on
# fails to compile.
e2e = ["dep:tauri-plugin-wdio-webdriver"]
