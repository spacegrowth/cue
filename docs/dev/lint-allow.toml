# External calls reachable while the hub's store is held ([[store_io]]): none. A new one fails the check.

[[lock_order]]
from = "db writer's marks"
to = "DB"
reason = "hub/live_writes.rs: the writer keeps what it last saved under its own lock while it writes; only the writer takes it (or, in a hub without the app, whoever writes), so nothing waits on it"

[[lock_order]]
from = "db writer's marks"
to = "folder facts"
reason = "db::open regroups projects by repo root (repos::repo_root) the first time the db is opened, under the write that opened it; folder facts is a leaf"

[[lock_order]]
from = "typing gate"
to = "db writer's marks"
reason = "the typing gate is held while a message is typed, by design (hub/send.rs wait_turn); in a hub without the app the draw a reply asks for writes where it runs. With the app the writer is its own thread"

[[lock_order]]
from = "typing gate"
to = "db writes"
reason = "the typing gate is held while a message is typed, by design (hub/send.rs wait_turn); the draw a reply asks for hands its save to the writer's queue: a lock held for a push"
