# What `cargo run -p xtask -- check` accepts today (see docs/dev/inventory.md). Every entry says why. An
# entry nothing matches any more fails the check, so this list only shrinks as the code gets there.

[store]
# The lock no external call (file, db, process, XPC, socket) may happen under.
lock = "the hub's store"

[[sync_command]]
name = "hide_window"
reason = "AppKit: hides the window, which must happen on the main thread"

[[sync_command]]
name = "set_fullscreen"
reason = "AppKit: window fullscreen, main thread only"

[[sync_command]]
name = "is_fullscreen"
reason = "AppKit: reads the window's fullscreen state, main thread only"

[[bare_lock]]
file = "hub/send.rs"
receiver = "gate"
name = "typing gate"
reason = "a session's typing gate is held for seconds by design and waited on with its own deadline and error (wait_turn), not locking::lock's 5 s limit"

[[tmux_seam]]
file = "terminal/test_tmux.rs"
function = "take_down"
reason = "the tests' own tmux seam: takes down the servers of test runs that have exited, each by its own private socket (-S), never the default one"

# Files not yet held to the size limits (a function over 60 lines outside tests, a file over 1,000), each as a
# whole until it's split. An entry for a file within the limits fails the check, so each goes when its split lands.

# Lock order today: B may be taken while A is held. A new edge fails the check until it's added here.

[[lock_order]]
from = "AUTO_SEEN"
to = "DB"
reason = "logs::steps::windows::auto_compact_at asks the db under its own seen cache; neither takes AUTO_SEEN"

[[lock_order]]
from = "AUTO_SEEN"
to = "folder facts"
reason = "db::open regroups projects by repo root (repos::repo_root) the first time the db is opened; folder facts is a leaf, read from memory (a new folder's lookup runs on its own thread, waited on at most 200 ms)"

[[lock_order]]
from = "DB"
to = "folder facts"
reason = "db::open regroups projects by repo root (repos::repo_root) the first time the db is opened, under DB; folder facts is a leaf, read from memory"

[[lock_order]]
from = "INDEX"
to = "REMOTE"
reason = "leads: the agent index held while a side table of the same file is read (a leaf); none of them takes INDEX"

[[lock_order]]
from = "INDEX"
to = "REMOTE_PILEAD"
reason = "leads: the agent index held while a side table of the same file is read (a leaf); none of them takes INDEX"

[[lock_order]]
from = "INDEX"
to = "VERIFY"
reason = "leads: the agent index held while a side table of the same file is read (a leaf); none of them takes INDEX"

[[lock_order]]
from = "actions STORE"
to = "folder facts"
reason = "actions key their state by repo root (repos::repo_root) under their own lock; folder facts is a leaf, read from memory"

[[lock_order]]
from = "actions WATCH"
to = "folder facts"
reason = "actions key their state by repo root (repos::repo_root) under their own lock; folder facts is a leaf, read from memory"

[[lock_order]]
from = "config file"
to = "config in memory"
reason = "a save or a refresh keeps what it wrote or read in memory under the file lock, so an older read can't land after a newer save; config in memory is a leaf"

[[lock_order]]
from = "a session's feed"
to = "WINDOWS"
reason = "logs/steps: a feed taking a read's lines in asks the window Claude Code's status line said for its session (known_window), under its lock; WINDOWS is a leaf, held only to look up or note a number (its file is read and written with it let go)"

[[lock_order]]
from = "a session's feed"
to = "config in memory"
reason = "logs/steps background.rs add_agent: a feed taking in an agent's launch looks up the session's machine (machines::list) to copy the agent's log over; config in memory is a leaf, held only to clone an Arc"

[[lock_order]]
from = "a session's feed"
to = "copies"
reason = "logs/steps background.rs add_agent/add_script: a background task launched in a machine's session starts its log's copy (machines::logs) as the feed takes the launch in; copies is a leaf (it spawns the copy, waits on nothing)"

[[lock_order]]
from = "open_terms"
to = "pty master"
reason = "term::foreground asks a terminal's PTY master for its foreground process with the terminal table held; the master lock is per terminal, a leaf"

[[lock_order]]
from = "parked saves"
to = "DB"
reason = "saves.rs: a save made after the store is let go writes what the store holds now, under its collection's save lock (save lock, then a look at the store, then the database), so saves landing in either order never leave an older state; nothing takes a save lock under the store or the database"

[[lock_order]]
from = "parked saves"
to = "db writer's marks"
reason = "saves.rs hand_in_parked_turn: a parked save is handed to the database writer under its save lock, so saves of one record are handed in the order the store changed; without a writer thread (tests, or one that couldn't start) the writing is done there, under it. The writer never takes a save lock"

[[lock_order]]
from = "parked saves"
to = "db writes"
reason = "saves.rs hand_in_parked_turn: a parked save is queued for the database writer under its save lock (so saves of one record are queued in the order the store changed); the queue is a leaf"

[[lock_order]]
from = "parked saves"
to = "folder facts"
reason = "db::open regroups projects by repo root (repos::repo_root) the first time the db is opened, under the save that opened it; folder facts is a leaf"

[[lock_order]]
from = "parked saves"
to = "the hub's store"
reason = "saves.rs: a save made after the store is let go writes what the store holds now, under its collection's save lock (save lock, then a look at the store, then the database), so saves landing in either order never leave an older state; nothing takes a save lock under the store or the database"

[[lock_order]]
from = "review queue saves"
to = "DB"
reason = "saves.rs: a save made after the store is let go writes what the store holds now, under its collection's save lock (save lock, then a look at the store, then the database), so saves landing in either order never leave an older state; nothing takes a save lock under the store or the database"

[[lock_order]]
from = "review queue saves"
to = "folder facts"
reason = "db::open regroups projects by repo root (repos::repo_root) the first time the db is opened, under the save that opened it; folder facts is a leaf"

[[lock_order]]
from = "review queue saves"
to = "the hub's store"
reason = "saves.rs: a save made after the store is let go writes what the store holds now, under its collection's save lock (save lock, then a look at the store, then the database), so saves landing in either order never leave an older state; nothing takes a save lock under the store or the database"

[[lock_order]]
from = "the hub's store"
to = "INDEX"
reason = "reviews_view reads the agent index under the store (plan §1.2); INDEX never takes the store"

[[lock_order]]
from = "the hub's store"
to = "config in memory"
reason = "settings are read under the store (context_keep, flag, moved); config in memory is a leaf, held only to clone an Arc"

[[lock_order]]
from = "the hub's store"
to = "folder facts"
reason = "a session's project (Sessions::mark → project_of_origin → repos::repo_root) is found under the store; folder facts is a leaf, read from memory (a new folder waits on its own lookup thread at most 200 ms, then is unknown)"

[[lock_order]]
from = "typing gate"
to = "CLAUDE"
reason = "the typing gate is taken first and held while a message is typed, by design (hub/send.rs wait_turn); typing into iTerm reads Claude Code's running list for the agent's tty (focus/apps.rs current_tty). Seen since the hub types through terminal::keys, which the check follows"

[[lock_order]]
from = "typing gate"
to = "config file"
reason = "the typing gate is taken first and held while a message is typed, by design (hub/send.rs wait_turn); a reply that redraws with no window (a test's hub) builds the snapshot on its own thread, which settles projects into the config file. Seen since the check follows a module's `use child::item` re-exports"

