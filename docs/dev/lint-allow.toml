# What `cargo run -p xtask -- check` accepts today (see docs/dev/inventory.md). Every entry says why. An
# entry nothing matches any more fails the check, so this list only shrinks as the code gets there.

[store]
# The lock no external call (file, db, process, XPC, socket) may happen under.
lock = "the hub's store"

[[sync_command]]
name = "hide_window"
reason = "AppKit: hides the window, which must happen on the main thread"

[[sync_command]]
name = "set_fullscreen"
reason = "AppKit: window fullscreen, main thread only"

[[sync_command]]
name = "is_fullscreen"
reason = "AppKit: reads the window's fullscreen state, main thread only"

[[bare_lock]]
file = "hub/send.rs"
receiver = "gate"
name = "typing gate"
reason = "a session's typing gate is held for seconds by design and waited on with its own deadline and error (wait_turn), not locking::lock's 5 s limit"

[[tmux_seam]]
file = "terminal/test_tmux.rs"
function = "take_down"
reason = "the tests' own tmux seam: takes down the servers of test runs that have exited, each by its own private socket (-S), never the default one"

# Lock order today: B may be taken while A is held. A new edge fails the check until it's added here.

[[lock_order]]
from = "AUTO_SEEN"
to = "DB"
reason = "logs::steps::auto_compact_at asks the db under its own seen cache; neither takes AUTO_SEEN"

[[lock_order]]
from = "AUTO_SEEN"
to = "REPOS"
reason = "logs::steps::auto_compact_at asks the db under its own seen cache; neither takes AUTO_SEEN"

[[lock_order]]
from = "DB"
to = "REPOS"
reason = "db::open regroups projects by repo root (live::repo_root) the first time the db is opened, under DB; REPOS is a leaf"

[[lock_order]]
from = "FEEDS"
to = "WINDOWS"
reason = "a log feed opened under its owner's lock reads the known-windows table (logs::steps::with_windows), a leaf"

[[lock_order]]
from = "INDEX"
to = "REMOTE"
reason = "leads: the agent index held while a side table of the same file is read (a leaf); none of them takes INDEX"

[[lock_order]]
from = "INDEX"
to = "REMOTE_PILEAD"
reason = "leads: the agent index held while a side table of the same file is read (a leaf); none of them takes INDEX"

[[lock_order]]
from = "INDEX"
to = "VERIFY"
reason = "leads: the agent index held while a side table of the same file is read (a leaf); none of them takes INDEX"

[[lock_order]]
from = "actions STORE"
to = "REPOS"
reason = "actions key their state by repo root (live::repo_root) under their own lock; REPOS is a leaf"

[[lock_order]]
from = "actions WATCH"
to = "REPOS"
reason = "actions key their state by repo root (live::repo_root) under their own lock; REPOS is a leaf"

[[lock_order]]
from = "actions log"
to = "WINDOWS"
reason = "a log feed opened under its owner's lock reads the known-windows table (logs::steps::with_windows), a leaf"

[[lock_order]]
from = "copies"
to = "WINDOWS"
reason = "a log feed opened under its owner's lock reads the known-windows table (logs::steps::with_windows), a leaf"

[[lock_order]]
from = "extensions log"
to = "WINDOWS"
reason = "a log feed opened under its owner's lock reads the known-windows table (logs::steps::with_windows), a leaf"

[[lock_order]]
from = "open_terms"
to = "pty master"
reason = "term::foreground asks a terminal's PTY master for its foreground process with the terminal table held; the master lock is per terminal, a leaf"

[[lock_order]]
from = "parked saves"
to = "DB"
reason = "saves.rs: a save made after the store is let go writes what the store holds now, under its collection's save lock (save lock, then a look at the store, then the database), so saves landing in either order never leave an older state; nothing takes a save lock under the store or the database"

[[lock_order]]
from = "parked saves"
to = "REPOS"
reason = "db::open regroups projects by repo root (live::repo_root) the first time the db is opened, under the save that opened it; REPOS is a leaf"

[[lock_order]]
from = "parked saves"
to = "the hub's store"
reason = "saves.rs: a save made after the store is let go writes what the store holds now, under its collection's save lock (save lock, then a look at the store, then the database), so saves landing in either order never leave an older state; nothing takes a save lock under the store or the database"

