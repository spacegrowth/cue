reason = "saves.rs: a save made after the store is let go writes what the store holds now, under its collection's save lock (save lock, then a look at the store, then the database), so saves landing in either order never leave an older state; nothing takes a save lock under the store or the database"

[[lock_order]]
from = "the hub's store"
to = "INDEX"
reason = "reviews_view reads the agent index under the store (plan §1.2); INDEX never takes the store"

[[lock_order]]
from = "the hub's store"
to = "REPOS"
reason = "Sessions::mark → model::project_of_origin → live::repo_root under the store; Phase 2 (§2.4) caches project lookups outside it"

[[lock_order]]
from = "typing gate"
to = "CLAUDE"
reason = "the typing gate is taken first and held while a message is typed, by design (hub/send.rs wait_turn); typing into iTerm reads Claude Code's running list for the agent's tty (focus::current_tty). Seen since the hub types through terminal::keys, which the check follows"

